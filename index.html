<!DOCTYPE html>
<html>
    <head>
        <title>Inventory Management System</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>

        <div class="app">
             <aside class="sidebar">
                <div class="logo">InventoryPro</div>
                <nav class="nav">
                    <a href="#" class="nav-link active" data-page="dashboard">Dashboard</a>
                    <a href="#" class="nav-link" data-page="products">Products</a>
                    <a href="#" class="nav-link" data-page="suppliers">Suppliers</a>
                    <a href="#" class="nav-link" data-page="sales">Sales</a>
                    <a href="#" class="nav-link" data-page="reports">Reports</a>
                 </nav>
             </aside>
             
             <div class="main">
                <header class="topbar">
                    <span class="topbar-title">Welcome back!</span>
                </header>
                
                <main class="content">
                    <section id="dashboard" class="page active">
                        <h1>Dashboard</h1>
                        <p class="subtitle">Welcome back! Here's what's happening today.</p>
                    </section>

                    <section id="products" class="page">
                        <h1>Products</h1>
                        <p class="subtitle">Manage your product catalog.</p>
                    </section>
                    
                    <section id="suppliers" class="page">
                        <h1>Suppliers</h1>
                        <p class="subtitle">Keep track of your suppliers.</p>
                    </section>
           
                    <section id="sales" class="page">
                        <h1>Sales</h1>
                        <p class="subtitle">Record and review sales.</p>
                    </section>

                    <section id="reports" class="page">     
                        <h1>Reports</h1>  
                        <p class="subtitle">Inventory and sales reports.</p> 
                    </section>
                </main>
            </div>

        </div>
        
        <script src="js/data.js"></script>
        <script src="js/products.js"></script>
        <script src="js/supplier.js"></script>
        <script src="js/sales.js"></script>
        <script src="js/reports.js"></script>
        <script src="js/app.js"></script>
    </body>
</html>
